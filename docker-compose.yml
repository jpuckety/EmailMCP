services:
  emailmcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailmcp
    restart: always
    env_file: emailmcp/.env
    environment:
      - EMAILMCP_LISTEN_ADDR=:8080
    ports:
      - "8080:8080"

  emailmcp-notify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailmcp-notify
    restart: always
    env_file: emailmcp/.env
    command: ["-transport", "notify"]
    environment:
      - EMAILMCP_LISTEN_ADDR=:8080
    ports:
      - "8081:8080"
